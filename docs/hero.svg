<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="convergence — an AI composes the dataflow; a deterministic engine runs it to a fixpoint">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171b22"/>
      <stop offset="1" stop-color="#0e1116"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a6b"/>
      <stop offset="1" stop-color="#ff5a7a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff6d5a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff6d5a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#232a36"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/>
    </marker>
    <marker id="arwA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff6d5a"/>
    </marker>
  </defs>

  <!-- card -->
  <rect x="1" y="1" width="898" height="318" rx="18" fill="url(#bg)" stroke="#333b48"/>
  <rect x="1" y="1" width="898" height="318" rx="18" fill="url(#dots)" opacity="0.5"/>
  <ellipse cx="700" cy="150" rx="220" ry="150" fill="url(#glow)" filter="url(#soft)"/>

  <!-- wordmark -->
  <text x="56" y="140" fill="#e6ebf2" font-size="58" font-weight="650" letter-spacing="1.5">
    <tspan fill="#ff6d5a">◆</tspan> convergence
  </text>
  <text x="60" y="178" fill="#c6cede" font-size="19">An AI composes the dataflow.</text>
  <text x="60" y="204" fill="#98a2b3" font-size="19">A deterministic engine runs it to a <tspan fill="#4ec9a5" font-weight="600">fixpoint</tspan>.</text>

  <!-- tags -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#98a2b3">
    <rect x="60" y="238" width="150" height="26" rx="13" fill="none" stroke="#333b48"/><text x="76" y="255">declarative recon</text>
    <rect x="220" y="238" width="168" height="26" rx="13" fill="none" stroke="#333b48"/><text x="236" y="255">convergence engine</text>
    <rect x="398" y="238" width="132" height="26" rx="13" fill="none" stroke="#333b48"/><text x="414" y="255">per-field provenance</text>
  </g>

  <!-- fixpoint motif -->
  <g stroke-width="2" fill="none">
    <!-- source -> engine -->
    <path d="M646,92 C690,92 700,140 726,150" stroke="#5b6472" marker-end="url(#arw)"/>
    <!-- engine -> entity -->
    <path d="M760,168 C736,214 700,224 662,228" stroke="#5b6472" marker-end="url(#arw)"/>
    <!-- fixpoint loop: entity -> engine (dashed accent) -->
    <path d="M648,214 C610,196 610,120 690,132" stroke="#ff6d5a" stroke-dasharray="5 5" marker-end="url(#arwA)"/>
  </g>

  <!-- nodes -->
  <g>
    <!-- source -->
    <rect x="560" y="74" width="92" height="40" rx="9" fill="#1e232c" stroke="#333b48"/>
    <rect x="560" y="74" width="4" height="40" rx="2" fill="#6ea8fe"/>
    <text x="576" y="90" fill="#98a2b3" font-family="ui-monospace, monospace" font-size="9" letter-spacing="1">SOURCE</text>
    <text x="576" y="105" fill="#e6ebf2" font-size="13" font-weight="600">CT logs</text>

    <!-- engine (hexagon) -->
    <polygon points="726,124 762,140 762,176 726,192 690,176 690,140" fill="#241a1a" stroke="url(#accent)"/>
    <text x="726" y="152" fill="#ff8a6b" font-family="ui-monospace, monospace" font-size="8.5" letter-spacing="0.5" text-anchor="middle">ENGINE</text>
    <text x="726" y="167" fill="#ffd9cf" font-size="11.5" font-weight="600" text-anchor="middle">converge</text>

    <!-- entity -->
    <rect x="566" y="210" width="96" height="40" rx="9" fill="#1e232c" stroke="#333b48"/>
    <rect x="566" y="210" width="4" height="40" rx="2" fill="#4ec9a5"/>
    <text x="582" y="226" fill="#98a2b3" font-family="ui-monospace, monospace" font-size="9" letter-spacing="1">ENTITY</text>
    <text x="582" y="241" fill="#e6ebf2" font-size="13" font-weight="600">host · ip · cert</text>
  </g>

  <text x="792" y="154" fill="#5b6472" font-family="ui-monospace, monospace" font-size="10" transform="rotate(90 792 154)" text-anchor="middle">re-triggers on change</text>
</svg>
