# Canonical example — see docs/FLOW_SPEC.md for the normative spec.
# Certificate Transparency -> hosts, converged. The source emits `cert`
# entities; a `fanout` block explodes each cert's SANs into `host` entities
# (keyed by a stable name); everything else accumulates onto the host and fires
# by CONVERGENCE — a block runs when the host's state satisfies its `when`,
# regardless of which block produced that state.
apiVersion: v0
kind: Flow
metadata:
  name: ct-recon
  description: CT certificates fanned into enriched host entities.

entities:
  cert:
    key: [id]                          # a CT log entry
  host:
    key: [name]                        # stable identity; enrichments accumulate
    # merge defaults to first-write-wins-with-provenance (monotonic => converges)
    fields:
      ip:                              # a typed field: materialize+link an `ip`
        links: ip                      #   entity keyed by address, with an edge
        as: address
        rel: resolves_to
  ip:
    key: [address]                     # first-class ip node (built from host.ip)

sources:
  - id: ct
    block: source.ct-log
    params:
      match_domains: ["nemanja.top"]    # a real CT query
    emits: cert
    filter:
      cert.is_precert: false            # skip pre-certificates

blocks:
  # Fan out: one cert -> one host per SAN, recording a cert --has_san--> host edge.
  - id: fanout
    uses: fanout
    for_each: cert
    inputs:
      items: "{{ cert.san }}"
      as: name
    merge_into: host
    relation: has_san

  # Resolve until the host has an ip (guard makes it run once, then settle).
  - id: resolve
    uses: dns.a
    for_each: host
    when:
      host.ip: { $exists: false }
    inputs:
      name: "{{ host.name }}"
    merge_into: host

  # Port scan — fires as soon as the host has an ip, no matter who set it.
  - id: scan
    uses: port.scan
    for_each: host
    when:
      host.ip: { $ne: null }
      host.open_ports: { $exists: false }
    inputs:
      target: "{{ host.ip }}"
    merge_into: host
    rate:
      max_concurrent: 10

  # Page title — fires once a web port is known to be open.
  - id: title
    uses: http.title
    for_each: host
    when:
      host.open_ports: { $in: [80, 443] }
      host.http_status: { $exists: false }
    inputs:
      url: "https://{{ host.name }}"
    merge_into: host

  # Mail exchangers (DNS MX).
  - id: mx
    uses: mail.mx
    for_each: host
    when:
      host.mx: { $exists: false }
    inputs:
      name: "{{ host.name }}"
    merge_into: host

  # Email auth posture (SPF + DMARC).
  - id: mail-auth
    uses: mail.auth
    for_each: host
    when:
      host.spf: { $exists: false }
    inputs:
      name: "{{ host.name }}"
    merge_into: host

  # Network owner of each ip node (ip entities are auto-materialized from
  # host.ip). RDAP over HTTP; ownership lives on the ip node, where it belongs.
  - id: ip-whois
    uses: rdap
    for_each: ip
    when:
      ip.network: { $exists: false }
    inputs:
      ip: "{{ ip.address }}"
    merge_into: ip
    rate:
      max_per_min: 120

  # ASN of each ip node via Team Cymru (port-43 whois; may be firewalled — the
  # block is tolerant and simply adds nothing when unreachable).
  - id: ip-asn
    uses: ip.asn
    for_each: ip
    when:
      ip.asn: { $exists: false }
    inputs:
      address: "{{ ip.address }}"
    merge_into: ip
