# Canonical example — see docs/FLOW_SPEC.md for the normative spec.
# Watch CT transparency logs; enrich every new cert into a host entity.
# Demonstrates: streaming source, sift filter/guards, fan-in with provenance,
# for_each-driven DAG edges.
apiVersion: v0
kind: Flow
metadata:
  name: ct-recon
  description: Enrich new certificates from CT logs into host entities.

entities:
  host:
    key: [ip]                          # same IP => same host
    merge: last-write-wins-with-provenance

sources:
  - id: ct
    block: source.ct-log
    params:
      match_domains: ["*.example.com"]  # empty => firehose
    emits: cert
    filter:
      cert.is_precert: false            # skip pre-certificates

blocks:
  # Resolve first: establishes host identity (ip) for everything downstream.
  - id: resolve
    uses: enrich.dns-a
    for_each: cert
    when:
      cert.san.0: { $exists: true }
    inputs:
      name: "{{ cert.san[0] }}"
    merge_into: host

  # RDAP registrar/abuse info, keyed onto the same host.
  - id: whois
    uses: enrich.rdap
    for_each: cert
    inputs:
      domain: "{{ cert.san[0] }}"
    merge_into: host
    rate:
      max_per_min: 60                   # RDAP is rate-limited

  # Port scan — only once we have an IP (for_each host, guarded on ip).
  - id: scan
    uses: enrich.nmap
    for_each: host
    when:
      host.ip: { $ne: null }
    inputs:
      target: "{{ host.ip }}"
      args: "-sV --top-ports 100"
    merge_into: host
    rate:
      max_concurrent: 10

  # Grab the page title, only if a web port is open.
  - id: title
    uses: enrich.http-title
    for_each: host
    when:
      host.open_ports: { $in: [80, 443] }
    inputs:
      url: "https://{{ host.ip }}"
    merge_into: host
