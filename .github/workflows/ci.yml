name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn

      # Skip husky's git-hook install in CI (no interactive git hooks needed).
      - run: yarn install --frozen-lockfile
        env:
          HUSKY: 0

      - run: yarn lint

      - run: yarn test

      # Headless render check for the qrp frontend (happy-dom, no browser).
      - run: yarn frontend:verify
